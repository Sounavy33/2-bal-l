<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Guia do GitHub</title>
  <style>
    :root { --blue:#2563eb; --dark:#0f172a; --light:#f1f5f9; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--dark); background:var(--light); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:680px; margin:auto; padding:24px 18px 120px; }
    .card { padding:24px; margin:14px 0; border-radius:22px; background:white; box-shadow:0 8px 24px #0f172a18; }
    h1 { margin-top:0; font-size:clamp(2rem,9vw,3.5rem); }
    p { line-height:1.55; }
    .voice { width:92px; height:92px; border:0; border-radius:50%; color:#fff; background:var(--blue); font-size:38px; box-shadow:0 8px 24px #2563eb66; cursor:pointer; }
    .voice.listening { background:#dc2626; animation:pulse 1s infinite; }
    @keyframes pulse { 50% { transform:scale(1.08); } }
    input { width:100%; padding:15px; border:1px solid #cbd5e1; border-radius:12px; font-size:16px; margin:8px 0; }
    button.action, a.action { display:block; width:100%; padding:14px 16px; margin-top:10px; border:0; border-radius:12px; color:#fff; background:var(--blue); font-size:16px; font-weight:700; text-align:center; text-decoration:none; cursor:pointer; }
    #status { min-height:25px; font-weight:600; }
    .hint { color:#475569; font-size:.95rem; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Guia do GitHub</h1>
      <p>Fale uma tarefa simples e eu mostro o botão para abrir o lugar certo.</p>
      <button class="voice" id="voiceButton" aria-label="Falar comando">🎙️</button>
      <p id="status">Toque no microfone e diga, por exemplo: “quero encontrar o log”.</p>
      <input id="command" placeholder="Ou escreva: trocar branch, encontrar log..." autocomplete="off">
      <button class="action" id="runButton">Guiar-me</button>
    </div>

    <div class="card" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <a class="action" id="resultLink" target="_blank" rel="noopener">Abrir no GitHub</a>
    </div>

    <div class="card">
      <h2>Comandos de exemplo</h2>
      <p class="hint">“trocar branch” · “encontrar log” · “ver pull request” · “abrir arquivos”</p>
    </div>
  </main>

  <script>
    const repo = 'https://github.com/Sounavy33/2-bal-l';
    const command = document.getElementById('command');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const title = document.getElementById('resultTitle');
    const text = document.getElementById('resultText');
    const link = document.getElementById('resultLink');

    function guide(raw) {
      const value = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      let destination;
      if (value.includes('branch') || value.includes('ramo')) {
        destination = ['Trocar ou consultar branch', 'Na página de branches, escolha o branch desejado.', `${repo}/branches`];
      } else if (value.includes('log') || value.includes('historico') || value.includes('histórico') || value.includes('commit')) {
        destination = ['Encontrar o log', 'Aqui você verá os commits e alterações do repositório.', `${repo}/commits`];
      } else if (value.includes('pull') || value.includes('solicitacao') || value.includes('solicitação')) {
        destination = ['Ver pull requests', 'Aqui ficam as solicitações de alteração do projeto.', `${repo}/pulls`];
      } else if (value.includes('arquivo') || value.includes('codigo') || value.includes('código')) {
        destination = ['Abrir arquivos do projeto', 'Esta é a página principal com os arquivos do repositório.', `${repo}/tree/main`];
      } else {
        status.textContent = 'Não reconheci esse comando. Tente “trocar branch” ou “encontrar log”.';
        result.hidden = true;
        return;
      }
      title.textContent = destination[0];
      text.textContent = destination[1];
      link.href = destination[2];
      result.hidden = false;
      status.textContent = 'Encontrei o caminho. Toque no botão azul para abrir.';
    }

    document.getElementById('runButton').addEventListener('click', () => guide(command.value));
    command.addEventListener('keydown', event => { if (event.key === 'Enter') guide(command.value); });

    const VoiceRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const voiceButton = document.getElementById('voiceButton');
    if (!VoiceRecognition) {
      voiceButton.disabled = true;
      voiceButton.style.opacity = '.5';
      status.textContent = 'O reconhecimento de voz não está disponível aqui. Digite o comando abaixo.';
    } else {
      const recognition = new VoiceRecognition();
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;
      recognition.onstart = () => { voiceButton.classList.add('listening'); status.textContent = 'Estou ouvindo...'; };
      recognition.onend = () => voiceButton.classList.remove('listening');
      recognition.onerror = () => { voiceButton.classList.remove('listening'); status.textContent = 'Não consegui ouvir. Tente novamente ou digite o comando.'; };
      recognition.onresult = event => {
        command.value = event.results[0][0].transcript;
        guide(command.value);
      };
      voiceButton.addEventListener('click', () => recognition.start());
    }
  </script>
</body>
</html>
